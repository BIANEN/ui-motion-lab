name: UI Motion Lab CI
on:
  push:
    branches: [setup/day-01-unseen-gallery, main]
  pull_request:
    branches: [main]
jobs:
  build-and-browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production assets
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: npm test
      - name: Upload screenshot and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day-01-browser-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
