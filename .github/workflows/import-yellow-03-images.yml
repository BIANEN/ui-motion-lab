name: Import approved 03 Yellow Wireframe Body images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-yellow-03-images.yml'
      - 'assets/spiritual-bodies/03-yellow-wireframe-light-body/archive-import.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-yellow-03-images
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify zip and original against SHA256, import image binaries
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, hashlib, urllib.request, io, zipfile, json
          base=pathlib.Path("assets/spiritual-bodies/03-yellow-wireframe-light-body")
          d=json.loads((base/"archive-import.json").read_text())
          assert d["status"]=="user-approved" and d["asset"]=="03-yellow-wireframe-light-body"
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"SpiritBodies-Approved-Archive/1.0"})
              with urllib.request.urlopen(req, timeout=90) as r: return r.read()
          def verify(content,entry):
              assert len(content)==entry["bytes"], "Wrong byte size: "+entry["path"]
              assert hashlib.sha256(content).hexdigest()==entry["sha256"], "Wrong sha256: "+entry["path"]
              target=base.joinpath(*pathlib.PurePosixPath(entry["path"]).parts)
              assert target.resolve().is_relative_to(base.resolve())
              target.parent.mkdir(parents=True,exist_ok=True)
              if target.exists(): assert target.read_bytes()==content, "Existing file mismatch"
              else: target.write_bytes(content)
              print("VERIFIED",entry["path"],len(content))
          original=d["original"]
          verify(get(original["url"]),original)
          arch=d["archive"]
          payload=get(arch["url"])
          assert len(payload)==arch["bytes"] and hashlib.sha256(payload).hexdigest()==arch["sha256"], "ZIP mismatch"
          bundled=base/"version-A/03-yellow-wireframe-light-body-A-package.zip"
          bundled.parent.mkdir(parents=True,exist_ok=True)
          if bundled.exists(): assert bundled.read_bytes()==payload, "Existing ZIP mismatch"
          else: bundled.write_bytes(payload)
          print("VERIFIED PACKAGE ZIP", bundled, len(payload))
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              for item in d["views"]:
                  raw=z.read(arch["zip_prefix"]+item["path"])
                  verify(raw,item)
          print("PASS: original JPG and 5 independent approved PNG views")
          PY
      - name: Commit image assets only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/spiritual-bodies/03-yellow-wireframe-light-body/source/ assets/spiritual-bodies/03-yellow-wireframe-light-body/version-A/views/ assets/spiritual-bodies/03-yellow-wireframe-light-body/version-A/03-yellow-wireframe-light-body-A-package.zip
          if ! git diff --cached --quiet; then
            git commit -m 'assets(03): archive approved yellow wireframe A views and source'
            for attempt in 1 2 3 4 5 6 7 8; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "Pushed approved images successfully"
                exit 0
              fi
              echo "Concurrent branch update, retry number $attempt"
              sleep 3
            done
            echo "Failed to push after multiple retries" >&2
            exit 1
          fi
