name: Bake visible human photons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-photons.yml'
      - 'experiments/human-mesh/bake_points.py'
      - 'experiments/human-mesh/photon-template.html'
      - 'experiments/human-mesh/smoke_test.cjs'
      - 'experiments/human-mesh/assets/makehuman_base_male.glb'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photon-bake
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mesh sampler
        run: python -m pip install --quiet --disable-pip-version-check 'trimesh>=4.8,<5' 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Bake blue-noise surface samples from CC0 GLB
        run: python experiments/human-mesh/bake_points.py
      - name: Validate offline viewer and JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('experiments/human-mesh/index.html').read_text()
          assert len(s)>150000, len(s)
          assert '{{PHOTON_DATA}}' not in s
          assert 'density:18000' in s
          assert 'V1.7.1' in s
          assert 'contactEaseMs:220' in s
          assert 'shockMaxPx:220' in s
          assert 'maxOffset:.26' in s
          assert 'window.photonDebug' in s
          assert 'https://' not in s, 'Viewer must not depend on CDNs or runtime GLB fetches'
          Path('/tmp/photon-v1-7-1.js').write_text(s.split('<script>')[1].split('</script>')[0])
          print('Validated offline HTML length:',len(s))
          PY
          node --check /tmp/photon-v1-7-1.js
      - name: Regression tests for 220ms contact easing, pointer smoothing, shockwave and orbit
        run: node experiments/human-mesh/smoke_test.cjs
      - name: Commit built independent experimental viewer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/human-mesh/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Bake V1.7.1 soft-contact photons with bounded local shockwave'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
