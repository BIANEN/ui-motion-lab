}

let targets,luminance,responsiveness;
function decodeBakedPoints(){
  const encoded=atob(PACKED);
  if(encoded.length!==COUNT*8)throw Error('Baked model length mismatch');
  const bytes=new Uint8Array(encoded.length);
  for(let i=0;i<encoded.length;i++)bytes[i]=encoded.charCodeAt(i);
  const dv=new DataView(bytes.buffer);
  targets=new Float32Array(COUNT*3);
  luminance=new Float32Array(COUNT);
  responsiveness=new Float32Array(COUNT);
  for(let i=0;i<COUNT;i++){
    const k=i*8,j=i*3;
    targets[j]=dv.getUint16(k,true)/32767.5-1;
    targets[j+1]=dv.getUint16(k+2,true)/32767.5-1;
    targets[j+2]=dv.getUint16(k+4,true)/32767.5-1;
    luminance[i]=bytes[k+6]/255;
    responsiveness[i]=.70+(bytes[k+7]/255)*.45;
  }
}
try{decodeBakedPoints()}catch(e){showError(e);return}

const depthBand=new Uint8Array(COUNT);
for(let i=0;i<COUNT;i++)seeds[i]=rand()*6.28318530718;
// Pointer event velocity is recorded without applying impulses; the frame loop
// low-pass filters speed, and each photon separately eases contact strength.
const pointer={x:-10000,y:-10000,lastX:0,lastY:0,inside:false,down:false,
  orbit:false,activity:0,charge:0,
  rawVX:0,rawVY:0,smoothVX:0,smoothVY:0,
  lastEventAt:0,lastMotionAt:-1e5};
const camera={yaw:0,yawGoal:0,pitch:0,pitchGoal:0,zoom:1,scale:1};
let wave=null,w=0,h=0,dpr=1,last=performance.now(),frameNumber=0;
let gpu=null;
const debug=window.photonDebug={
  loaded:true,version:'1.7.2',points:COUNT,physics:PHYSICS,
  source:'prebaked CC0 MakeHuman GLB',config:CONFIG,
  renderer:'Canvas2D (fallback)',drawCalls:0,scatterHits:0,charge:0,
  holdRepelHits:0,holdRepelImpulse:0,webglFrames:0,webglDrawCalls:0,fallbackReason:null,webglAvailable:false,
  releaseEvents:0,maxDisplacementPx:0,orbitYaw:0,orbitPitch:0,
  maxContact:0,contactHits:0,pointerSmoothedSpeed:0,shockHits:0,
  maxShockHitDistancePx:0,waveRadiusPx:0,
  fpsMeasured:0,status:'ready'
};

function resize(){
  w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,1.6);
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  glCanvas.width=Math.round(w*dpr);glCanvas.height=Math.round(h*dpr);
  fxCanvas.width=Math.round(w*dpr);fxCanvas.height=Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  overlayCtx.setTransform(dpr,0,0,dpr,0,0);
  if(gpu)gpu.gl.viewport(0,0,glCanvas.width,glCanvas.height);
  camera.scale=Math.min(h*.82,w*.72)*camera.zoom;
  frameNumber=0;
}
addEventListener('resize',resize,{passive:true});
resize();

function updatePointer(e){
  const now=performance.now();
  const x=e.clientX,y=e.clientY;
  const dx=x-pointer.lastX,dy=y-pointer.lastY;
  pointer.x=x;pointer.y=y;pointer.inside=true;
  const elapsed=pointer.lastEventAt
    ? Math.max(8,Math.min(80,now-pointer.lastEventAt)) : 16.667;
  if(pointer.orbit){
    camera.yawGoal+=dx/Math.max(w,1)*6.28318*1.1;
    camera.pitchGoal=Math.max(-1.02,Math.min(1.02,camera.pitchGoal+dy/Math.max(h,1)*2.8));
    pointer.rawVX=0;pointer.rawVY=0;
  }else if(!pointer.down && (dx!==0||dy!==0)){
    // Normalize pointer motion to a 60Hz baseline. These are input targets,
    // NOT direct photon impulses. The simulation smooths them independently.
    const factor=16.667/elapsed;
    pointer.rawVX=Math.max(-60,Math.min(60,dx*factor));
    pointer.rawVY=Math.max(-60,Math.min(60,dy*factor));
    pointer.lastMotionAt=now;
  }
  pointer.lastX=x;pointer.lastY=y;
  pointer.lastEventAt=now;
}
inputSurface.addEventListener('pointermove',updatePointer);
inputSurface.addEventListener('pointerenter',e=>{
  pointer.lastX=e.clientX;pointer.lastY=e.clientY;
  pointer.lastEventAt=performance.now();
  pointer.rawVX=0;pointer.rawVY=0;
  updatePointer(e);
});
inputSurface.addEventListener('pointerdown',e=>{
  pointer.lastX=e.clientX;pointer.lastY=e.clientY;
  pointer.orbit=Boolean(e.shiftKey||e.button===2);
  pointer.down=!pointer.orbit;
  pointer.charge=pointer.down?.16:0;
  pointer.rawVX=0;pointer.rawVY=0;pointer.activity=0;
  pointer.smoothVX=0;pointer.smoothVY=0;
  updatePointer(e);
  try{inputSurface.setPointerCapture(e.pointerId)}catch(_){}
});
function endPointer(){
  if(pointer.down){
    const energy=Math.min(2.7,.9+pointer.charge*1.2);
    wave={x:pointer.x,y:pointer.y,radius:0,energy,age:0};
    debug.releaseEvents+=1;
  }
  pointer.down=false;pointer.orbit=false;pointer.charge=0;
  pointer.rawVX=0;pointer.rawVY=0;
}
inputSurface.addEventListener('pointerup',endPointer);
inputSurface.addEventListener('pointercancel',endPointer);
inputSurface.addEventListener('pointerleave',()=>{
  if(!pointer.down&&!pointer.orbit){pointer.inside=false;pointer.activity=0;pointer.rawVX=0;pointer.rawVY=0;pointer.x=-10000;pointer.y=-10000;}
});
inputSurface.addEventListener('contextmenu',e=>e.preventDefault());
inputSurface.addEventListener('wheel',e=>{
  e.preventDefault();
  camera.zoom=Math.max(VISUALS.zoomMin,Math.min(VISUALS.zoomMax,camera.zoom-e.deltaY*.001));
  camera.scale=Math.min(h*.82,w*.72)*camera.zoom;
},{passive:false});

function project(i,yawCos,yawSin,pitchCos,pitchSin){
  const j=i*3;
  const x=targets[j]+offset[j];
  const y=targets[j+1]+offset[j+1];
  const z=targets[j+2]+offset[j+2];
  const xr=x*yawCos+z*yawSin;
  const zr=-x*yawSin+z*yawCos;
  const yr=y*pitchCos-zr*pitchSin;
  const depth=y*pitchSin+zr*pitchCos;
  const perspective=1/(1+depth*.38);
  const scale=camera.scale*perspective;
  screenX[i]=w*.5+xr*scale;
  screenY[i]=h*.51-yr*scale;
  depthBand[i]=Math.max(0,Math.min(4,Math.floor((.52+depth*.5+luminance[i]*.24)*4.2)-1));
}

// Each photon has its own continuous contact envelope. A fresh contact does
// not inherit the old full scatter force: exponential contact easing (220ms)
// increases the force gradually, independent of smoothed pointer velocity.
function applyScatter(i,j,dt){
  const active=pointer.inside&&!pointer.orbit&&!pointer.down&&pointer.activity>.02;
  const dx=screenX[i]-pointer.x,dy=screenY[i]-pointer.y;
  const r=PHYSICS.scatterRadiusPx;
  const d2=dx*dx+dy*dy;
  const inside=active&&d2<r*r;
  const distance=inside?Math.sqrt(d2)+.01:0;
  const radial=inside?Math.max(0,1-distance/r):0;
  const falloff=radial*radial*(3-2*radial); // smoothstep at the boundary
  const target=inside?falloff*Math.min(1,pointer.activity):0;
  const oldContact=contactEnvelope[i];
  const easeMs=target>oldContact?PHYSICS.contactEaseMs:PHYSICS.contactReleaseMs;
  const alpha=1-Math.exp(-(16.667*dt)/easeMs);
  const contact=oldContact+(target-oldContact)*alpha;
  contactEnvelope[i]=contact;
  if(contact>debug.maxContact)debug.maxContact=contact;
  if(!inside||contact<.0001)return;
  const nx=dx/distance,ny=dy/distance;
  const strength=PHYSICS.scatterVelocity*contact*dt*responsiveness[i];
  velocity[j]+=nx*strength+(pointer.smoothVX/Math.max(camera.scale,1))*strength*.11;
  velocity[j+1]-=ny*strength-(pointer.smoothVY/Math.max(camera.scale,1))*strength*.11;
  velocity[j+2]+=Math.sin(seeds[i]*10.1)*.20*strength;
  scatterState[i]=Math.max(scatterState[i],.18+contact*.72);
  debug.contactHits+=1;
  debug.scatterHits+=1;
}

// Hold=Repel: slow-ramping, spatially limited outward force. Charge is the
// time-based intensity accumulator and is also used by Release Shockwave.
function applyHold(i,j,dt){
  if(!pointer.down||pointer.orbit||CONFIG.hold!=='repel')return;
  const dx=screenX[i]-pointer.x,dy=screenY[i]-pointer.y;
  const radius=PHYSICS.chargeRadiusPx, distanceSquared=dx*dx+dy*dy;
  if(distanceSquared>=radius*radius)return;
  const distance=Math.sqrt(distanceSquared)+.01;
  const falloff=Math.max(0,1-distance/radius);
  const smooth=falloff*falloff*(3-2*falloff);
  const strength=.0017*(.28+pointer.charge)*smooth*dt*responsiveness[i];
  velocity[j]+=(dx/distance)*strength;
  velocity[j+1]-=(dy/distance)*strength;
  velocity[j+2]+=Math.sin(seeds[i]*8+frameNumber*.12)*strength*.24;
  scatterState[i]=Math.max(scatterState[i],.18+smooth*.38);
  debug.holdRepelHits+=1;
  debug.holdRepelImpulse+=strength;
}

// A travelling annular impulse travels across the actual projected anatomy.
function applyShockwave(i,j,dt){
  if(!wave)return;
  const dx=screenX[i]-wave.x,dy=screenY[i]-wave.y;
  const distance=Math.sqrt(dx*dx+dy*dy)+.001;
  // Absolute hard boundary: no shockwave impulse beyond 220 screen pixels.
  if(distance>PHYSICS.shockMaxPx)return;
  const delta=Math.abs(distance-wave.radius);
  if(delta>=PHYSICS.shockWidthPx)return;
  const influence=1-delta/PHYSICS.shockWidthPx;
  const force=PHYSICS.shockVelocity*wave.energy*influence*influence*dt;
  velocity[j]+=dx/distance*force;
  velocity[j+1]-=dy/distance*force;
  velocity[j+2]+=Math.sin(seeds[i]*4.2)*force*.5;
  scatterState[i]=Math.max(scatterState[i],.65+.35*influence);
  debug.shockHits+=1;
  debug.maxShockHitDistancePx=Math.max(debug.maxShockHitDistancePx,distance);
}

function applyReturn(i,j,dt,t){
  const scattered=scatterState[i];
  const spring=(PHYSICS.returnSpringRest*(1-scattered)+PHYSICS.returnSpringScatter*scattered)*dt;
  const damping=Math.pow(
    PHYSICS.returnDampingRest*(1-scattered)+PHYSICS.returnDampingScatter*scattered,dt
  );
  const bx=Math.sin(t*.65+seeds[i])*.0006;
  const by=Math.cos(t*.73+seeds[i])*.0006;
  velocity[j]=(velocity[j]-(offset[j]-bx)*spring)*damping;
  velocity[j+1]=(velocity[j+1]-(offset[j+1]-by)*spring)*damping;
  velocity[j+2]=(velocity[j+2]-offset[j+2]*spring)*damping;
  offset[j]+=velocity[j]*dt;
  offset[j+1]+=velocity[j+1]*dt;
  offset[j+2]+=velocity[j+2]*dt;
  // Keep the sculpture recoverable even after repeated fast pointer strokes.
  const magnitude=Math.hypot(offset[j],offset[j+1],offset[j+2]);
  if(magnitude>PHYSICS.maxOffset){
    const s=PHYSICS.maxOffset/magnitude;
    offset[j]*=s;offset[j+1]*=s;offset[j+2]*=s;
    velocity[j]*=.5;velocity[j+1]*=.5;velocity[j+2]*=.5;
  }
  scatterState[i]*=Math.pow(PHYSICS.scatterDecay,dt);
}

function updatePhysics(dt,t){
  camera.yaw+=(camera.yawGoal-camera.yaw)*.10;
  camera.pitch+=(camera.pitchGoal-camera.pitch)*.10;
  // Pointer-speed smoothing in the simulation time domain: browser events may
  // arrive at irregular rates. Decay stale input instead of applying impulses
  // indefinitely after the pointer stops.
  if(t*1000-pointer.lastMotionAt>PHYSICS.pointerIdleMs){
    pointer.rawVX=0;pointer.rawVY=0;
  }
  const speedAlpha=1-Math.exp(-(16.667*dt)/PHYSICS.pointerVelocitySmoothMs);
  pointer.smoothVX+=(pointer.rawVX-pointer.smoothVX)*speedAlpha;
  pointer.smoothVY+=(pointer.rawVY-pointer.smoothVY)*speedAlpha;
  const speed=Math.hypot(pointer.smoothVX,pointer.smoothVY);
  pointer.activity=pointer.inside&&!pointer.down&&!pointer.orbit
    ? Math.min(1,speed/15):0;
  debug.pointerSmoothedSpeed=speed;
  if(pointer.down)pointer.charge=Math.min(PHYSICS.maxCharge,pointer.charge+PHYSICS.chargeRate*dt);
  if(wave){
    wave.radius=Math.min(PHYSICS.shockMaxPx,wave.radius+PHYSICS.shockSpeedPx*dt);
    wave.age+=dt;
    if(wave.radius>=PHYSICS.shockMaxPx)wave=null;
  }
  debug.waveRadiusPx=wave?wave.radius:0;
  debug.maxContact=0;
  const yc=Math.cos(camera.yaw),ys=Math.sin(camera.yaw);
  const pc=Math.cos(camera.pitch),ps=Math.sin(camera.pitch);
  let maxDisplacement=0;
  for(let i=0;i<COUNT;i++){
    const j=i*3;
    project(i,yc,ys,pc,ps);
    applyScatter(i,j,dt);
    applyHold(i,j,dt);
    applyShockwave(i,j,dt);
    applyReturn(i,j,dt,t);
    if(i%31===0){
      const dist=Math.hypot(offset[j],offset[j+1])*camera.scale;
      if(dist>maxDisplacement)maxDisplacement=dist;
    }
  }
  debug.maxDisplacementPx=Math.round(maxDisplacement);
  debug.charge=pointer.charge;
  debug.orbitYaw=camera.yaw;
  debug.orbitPitch=camera.pitch;
}

// Hybrid backend: native WebGL (GPU point sprites) with a genuine Canvas2D
// fallback. Both renderers consume the *same* CPU-simulated mesh photons.
// The baked HTML makes zero runtime network requests and needs no libraries.
function fallbackToCanvas(reason){
  gpu=null;
  glCanvas.style.display='none';
  canvas.style.display='block';
  debug.renderer='Canvas2D (fallback)';
  debug.fallbackReason=String(reason||'WebGL unavailable');
  frameNumber=0;
}
function initializeHybridRenderer(){
  if(CONFIG.renderer!=='hybrid'){fallbackToCanvas('Canvas selected');return;}
  try{
    const options={alpha:false,antialias:false,preserveDrawingBuffer:true,powerPreference:'high-performance'};
    const gl=glCanvas.getContext('webgl2',options)||glCanvas.getContext('webgl',options);
    if(!gl)throw Error('WebGL context unavailable');
    const vsSource=
      'precision highp float; attribute vec2 aScreen; attribute float aBand;'+
      'uniform vec2 uResolution; uniform float uDpr; varying float vBand;'+
      'void main(){vec2 ndc=vec2(aScreen.x/uResolution.x*2.0-1.0,'+
      '1.0-aScreen.y/uResolution.y*2.0);gl_Position=vec4(ndc,0.0,1.0);'+
      'gl_PointSize=(3.15+aBand*0.23)*uDpr;vBand=aBand;}';
    const fsSource=
      'precision mediump float; varying float vBand;'+
      'void main(){vec2 q=(gl_PointCoord-0.5)*2.0;float r2=dot(q,q);'+
      'if(r2>1.0)discard;'+
      'float core=exp(-r2*12.0);float glow=exp(-r2*2.8);'+
      'vec3 col=mix(vec3(0.43,0.39,0.98),vec3(0.99,0.99,1.0),clamp(vBand/4.0,0.0,1.0));'+
      'float alpha=(core*0.91+glow*0.21)*0.96;gl_FragColor=vec4(col,alpha);}';
    const bgVS=
      'precision mediump float; attribute vec2 aCorner; varying vec2 vUv;'+
      'void main(){vUv=(aCorner+1.0)*0.5;gl_Position=vec4(aCorner,0.0,1.0);}';
    const bgFS=
      'precision mediump float;varying vec2 vUv;uniform float uFade;'+
      'void main(){vec2 p=(vUv-vec2(0.5,0.5))*vec2(2.4,2.0);'+
      'float fog=exp(-dot(p,p)*2.25);'+
      'vec3 ink=vec3(0.012,0.016,0.039)+vec3(0.047,0.036,0.108)*fog;'+
      'gl_FragColor=vec4(ink,uFade);}';
    function shader(type,code){
      const obj=gl.createShader(type);
      if(!obj)throw Error('WebGL shader allocation failed');
      gl.shaderSource(obj,code);gl.compileShader(obj);
      if(!gl.getShaderParameter(obj,gl.COMPILE_STATUS))
        throw Error('WebGL shader: '+gl.getShaderInfoLog(obj));
      return obj;
    }
    function program(vertex,fragment){
      const prog=gl.createProgram();
      if(!prog)throw Error('WebGL program allocation failed');
      gl.attachShader(prog,shader(gl.VERTEX_SHADER,vertex));
      gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fragment));
      gl.linkProgram(prog);
      if(!gl.getProgramParameter(prog,gl.LINK_STATUS))
        throw Error('WebGL link: '+gl.getProgramInfoLog(prog));
      return prog;
    }
    const backgroundProgram=program(bgVS,bgFS);
    const photonProgram=program(vsSource,fsSource);
    const quad=gl.createBuffer(),pointBuffer=gl.createBuffer();
    if(!quad||!pointBuffer)throw Error('WebGL vertex buffer unavailable');
    gl.bindBuffer(gl.ARRAY_BUFFER,quad);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.viewport(0,0,glCanvas.width,glCanvas.height);
    gl.clearColor(.012,.016,.039,1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gpu={gl,quad,pointBuffer,backgroundProgram,photonProgram,
      quadLoc:gl.getAttribLocation(backgroundProgram,'aCorner'),
      fadeLoc:gl.getUniformLocation(backgroundProgram,'uFade'),
      posLoc:gl.getAttribLocation(photonProgram,'aScreen'),
      bandLoc:gl.getAttribLocation(photonProgram,'aBand'),
      resolutionLoc:gl.getUniformLocation(photonProgram,'uResolution'),
      dprLoc:gl.getUniformLocation(photonProgram,'uDpr'),
      data:new Float32Array(COUNT*3)};
    if(gpu.quadLoc<0||gpu.posLoc<0||gpu.bandLoc<0)
      throw Error('WebGL attributes missing');
    glCanvas.style.display='block';
    canvas.style.display='none';
    debug.renderer='WebGL';
    debug.webglAvailable=true;
    debug.fallbackReason=null;
    frameNumber=0;
  }catch(e){fallbackToCanvas(e&&e.message?e.message:e);}
}
glCanvas.addEventListener('webglcontextlost',e=>{
  e.preventDefault();
  fallbackToCanvas('WebGL context lost');
});
glCanvas.addEventListener('webglcontextrestored',()=>initializeHybridRenderer());

function renderGpu(){
  if(!gpu)throw Error('GPU renderer unavailable');
  const gl=gpu.gl;
  const dat=gpu.data;
  let visible=0;
  for(let i=0;i<COUNT;i++){
    const j=i*3;
    const x=screenX[i],y=screenY[i];
    dat[j]=x;dat[j+1]=y;dat[j+2]=depthBand[i];
    if(x>=0&&x<w&&y>=0&&y<h)visible++;
  }
  gl.viewport(0,0,glCanvas.width,glCanvas.height);
  gl.disableVertexAttribArray(0);
  gl.disableVertexAttribArray(1);
  gl.disableVertexAttribArray(2);
  gl.useProgram(gpu.backgroundProgram);
  gl.bindBuffer(gl.ARRAY_BUFFER,gpu.quad);
  gl.enableVertexAttribArray(gpu.quadLoc);
  gl.vertexAttribPointer(gpu.quadLoc,2,gl.FLOAT,false,0,0);
  gl.uniform1f(gpu.fadeLoc,VISUALS.trailFade);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  gl.disableVertexAttribArray(gpu.quadLoc);
  gl.useProgram(gpu.photonProgram);
  gl.bindBuffer(gl.ARRAY_BUFFER,gpu.pointBuffer);
  gl.bufferData(gl.ARRAY_BUFFER,dat,gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(gpu.posLoc);
  gl.enableVertexAttribArray(gpu.bandLoc);
  gl.vertexAttribPointer(gpu.posLoc,2,gl.FLOAT,false,12,0);
  gl.vertexAttribPointer(gpu.bandLoc,1,gl.FLOAT,false,12,8);
  gl.uniform2f(gpu.resolutionLoc,w,h);
  gl.uniform1f(gpu.dprLoc,dpr);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
  gl.drawArrays(gl.POINTS,0,COUNT);
  gl.disableVertexAttribArray(gpu.posLoc);
  gl.disableVertexAttribArray(gpu.bandLoc);
  if(typeof gl.getError==='function'&&gl.getError()!==gl.NO_ERROR)
    throw Error('WebGL drawing failed');
  debug.drawCalls=visible;
  debug.webglFrames+=1;
  debug.webglDrawCalls+=1;
}

function renderBackground(){
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=frameNumber===0?VISUALS.background:'rgba(3,4,10,'+VISUALS.trailFade+')';
  ctx.fillRect(0,0,w,h);
  const halo=ctx.createRadialGradient(w*.5,h*.49,0,w*.5,h*.49,Math.min(w,h)*.38);
  halo.addColorStop(0,'rgba(60,45,137,.17)');
  halo.addColorStop(.55,'rgba(41,33,96,.05)');
  halo.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=halo;
  ctx.fillRect(w*.17,h*.08,w*.66,h*.84);
}

function renderPhotons(){
  ctx.globalCompositeOperation='lighter';
  let drawn=0;
  for(let band=0;band<5;band++){
    ctx.fillStyle=VISUALS.palette[band];
    const box=VISUALS.grainSize+(band>=3?.30:(band>=1?.14:0));
    for(let i=0;i<COUNT;i++){
      if(depthBand[i]!==band)continue;
      const x=screenX[i],y=screenY[i];
      if(x<0||x>=w||y<0||y>=h)continue;
      ctx.fillRect(x,y,box,box);
      drawn++;
    }
  }
  ctx.fillStyle='rgba(151,142,255,.21)';
  for(let i=0;i<COUNT;i+=VISUALS.haloStep){
    const x=screenX[i],y=screenY[i];
    if(x>-4&&x<w+4&&y>-4&&y<h+4)ctx.fillRect(x-1.25,y-1.25,3.5,3.5);
  }
  ctx.globalCompositeOperation='source-over';
  debug.drawCalls=drawn;
}

function renderInteraction(){
  const cx=gpu?overlayCtx:ctx;
  if(gpu)overlayCtx.clearRect(0,0,w,h);
  if(pointer.down&&pointer.inside){
    const radius=18+pointer.charge*24;
    cx.strokeStyle='rgba(198,190,255,'+Math.min(.52,.18+pointer.charge*.14)+')';
    cx.lineWidth=1;
    cx.beginPath();cx.arc(pointer.x,pointer.y,radius,0,Math.PI*2);cx.stroke();
  }
  if(wave){
    cx.strokeStyle='rgba(192,180,255,'+(Math.max(0,.5-wave.age*.018)).toFixed(3)+')';
    cx.lineWidth=1.1;
    cx.beginPath();cx.arc(wave.x,wave.y,wave.radius,0,Math.PI*2);cx.stroke();
  }
}

function frame(now){
  try{
    const dt=Math.max(.2,Math.min(2.0,(now-last)/16.667||1));
    last=now;
    updatePhysics(dt,now*.001);
    if(gpu){
      try{renderGpu();}
      catch(gpuError){
        fallbackToCanvas(gpuError&&gpuError.message?gpuError.message:gpuError);
        renderBackground();renderPhotons();
      }
    }else{
      renderBackground();
      renderPhotons();
    }
    renderInteraction();
    frameNumber+=1;
    debug.fpsMeasured=Math.round(1000/Math.max(1,dt*16.667));
    debug.lastFrame=now;
    requestAnimationFrame(frame);
  }catch(e){debug.status='error';showError(e);}
}
status.textContent='V1.7.2 · 12K PHOTONS · HOLD: REPEL · WEBGL / CANVAS FALLBACK · SHIFT / RIGHT-DRAG: ORBIT';
initializeHybridRenderer();
requestAnimationFrame(frame);
})();
</script></body></html>
