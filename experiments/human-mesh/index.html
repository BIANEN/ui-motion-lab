const canvas=document.getElementById('canvas');
const status=document.getElementById('status');
const problem=document.getElementById('problem');
function showError(e){
  problem.style.display='block';
  problem.textContent='The particle viewer could not start: '+(e&&e.message?e.message:String(e));
}
let ctx;
try{ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});if(!ctx)throw Error('Canvas2D unavailable');}
catch(e){showError(e);return;}

let targets,luminance;
function decodeBakedPoints(){
  const encoded=atob(PACKED);
  if(encoded.length!==COUNT*7)throw Error('Baked model length mismatch');
  const bytes=new Uint8Array(encoded.length);
  for(let i=0;i<encoded.length;i++)bytes[i]=encoded.charCodeAt(i);
  const dv=new DataView(bytes.buffer);
  targets=new Float32Array(COUNT*3);
  luminance=new Float32Array(COUNT);
  for(let i=0;i<COUNT;i++){
    const k=i*7,j=i*3;
    targets[j]=dv.getUint16(k,true)/32767.5-1;
    targets[j+1]=dv.getUint16(k+2,true)/32767.5-1;
    targets[j+2]=dv.getUint16(k+4,true)/32767.5-1;
    luminance[i]=bytes[k+6]/255;
  }
}
try{decodeBakedPoints()}catch(e){showError(e);return}

let random=17031991;
function rand(){random=(random*1664525+1013904223)>>>0;return random/4294967296;}
const offset=new Float32Array(COUNT*3);
const velocity=new Float32Array(COUNT*3);
const scatterState=new Float32Array(COUNT);
const seeds=new Float32Array(COUNT);
const screenX=new Float32Array(COUNT);
const screenY=new Float32Array(COUNT);
const depthBand=new Uint8Array(COUNT);
for(let i=0;i<COUNT;i++)seeds[i]=rand()*6.28318530718;
const pointer={x:-10000,y:-10000,lastX:0,lastY:0,inside:false,down:false,orbit:false,activity:0,charge:0,dragX:0,dragY:0};
const camera={yaw:0,yawGoal:0,pitch:0,pitchGoal:0,zoom:1,scale:1};
let wave=null,w=0,h=0,dpr=1,last=performance.now(),frameNumber=0;
const debug=window.photonDebug={
  loaded:true,version:'1.7',points:COUNT,
  source:'prebaked CC0 MakeHuman GLB',config:CONFIG,
  renderer:'Canvas2D',drawCalls:0,scatterHits:0,charge:0,
  releaseEvents:0,maxDisplacementPx:0,orbitYaw:0,orbitPitch:0,
  fpsMeasured:0,status:'ready'
};

function resize(){
  w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,1.6);
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  camera.scale=Math.min(h*.82,w*.72)*camera.zoom;
  frameNumber=0;
}
addEventListener('resize',resize,{passive:true});
resize();

function updatePointer(e){
  const x=e.clientX,y=e.clientY;
  const dx=x-pointer.lastX,dy=y-pointer.lastY;
  pointer.x=x;pointer.y=y;pointer.inside=true;
  if(pointer.orbit){
    camera.yawGoal+=dx/Math.max(w,1)*6.28318*1.1;
    camera.pitchGoal=Math.max(-1.02,Math.min(1.02,camera.pitchGoal+dy/Math.max(h,1)*2.8));
    pointer.activity=0;
  }else if(!pointer.down&&pointer.lastX!==0){
    // A moving pointer injects genuine outward kinetic energy in nearby photons.
    const speed=Math.min(80,Math.hypot(dx,dy));
    pointer.activity=Math.min(1.75,.3+speed/22);
    pointer.dragX=dx;pointer.dragY=dy;
  }
  pointer.lastX=x;pointer.lastY=y;
}
canvas.addEventListener('pointermove',updatePointer);
canvas.addEventListener('pointerenter',e=>{pointer.lastX=e.clientX;pointer.lastY=e.clientY;updatePointer(e)});
canvas.addEventListener('pointerdown',e=>{
  pointer.lastX=e.clientX;pointer.lastY=e.clientY;
  pointer.orbit=Boolean(e.shiftKey||e.button===2);
  pointer.down=!pointer.orbit;
  pointer.charge=pointer.down?.16:0;
  pointer.activity=0;
  updatePointer(e);
  try{canvas.setPointerCapture(e.pointerId)}catch(_){}
});
function endPointer(){
  if(pointer.down){
    const energy=Math.min(2.7,.9+pointer.charge*1.2);
    wave={x:pointer.x,y:pointer.y,radius:0,energy,age:0};
    debug.releaseEvents+=1;
  }
  pointer.down=false;pointer.orbit=false;pointer.charge=0;
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('pointerleave',()=>{
  if(!pointer.down&&!pointer.orbit){pointer.inside=false;pointer.activity=0;pointer.x=-10000;pointer.y=-10000;}
});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  camera.zoom=Math.max(VISUALS.zoomMin,Math.min(VISUALS.zoomMax,camera.zoom-e.deltaY*.001));
  camera.scale=Math.min(h*.82,w*.72)*camera.zoom;
},{passive:false});

function project(i,yawCos,yawSin,pitchCos,pitchSin){
  const j=i*3;
  const x=targets[j]+offset[j];
  const y=targets[j+1]+offset[j+1];
  const z=targets[j+2]+offset[j+2];
  const xr=x*yawCos+z*yawSin;
  const zr=-x*yawSin+z*yawCos;
  const yr=y*pitchCos-zr*pitchSin;
  const depth=y*pitchSin+zr*pitchCos;
  const perspective=1/(1+depth*.38);
  const scale=camera.scale*perspective;
  screenX[i]=w*.5+xr*scale;
  screenY[i]=h*.51-yr*scale;
  depthBand[i]=Math.max(0,Math.min(4,Math.floor((.52+depth*.5+luminance[i]*.24)*4.2)-1));
}

// Pointer scatter uses outward velocity (not an instantaneous position change).
function applyScatter(i,j,dt){
  if(!pointer.inside||pointer.orbit||pointer.down||pointer.activity<.055)return;
  const dx=screenX[i]-pointer.x,dy=screenY[i]-pointer.y;
  const d2=dx*dx+dy*dy,r=PHYSICS.scatterRadiusPx;
  if(d2>=r*r)return;
  const distance=Math.sqrt(d2)+.01;
  const shape=1-distance/r;
  const strength=PHYSICS.scatterVelocity*shape*shape*pointer.activity*dt;
  const nx=dx/distance,ny=dy/distance;
  velocity[j]+=nx*strength+(pointer.dragX/Math.max(camera.scale,1))*strength*.15;
  velocity[j+1]-=ny*strength-(pointer.dragY/Math.max(camera.scale,1))*strength*.15;
  velocity[j+2]+=(Math.sin(seeds[i]*10.1)*.38)*strength;
  scatterState[i]=Math.max(scatterState[i],.38+shape*.62);
  debug.scatterHits+=1;
}

// Hold locally energizes photons while building the release-wave intensity.
function applyCharge(i,j,dt){
  if(!pointer.down||pointer.orbit)return;
  const dx=screenX[i]-pointer.x,dy=screenY[i]-pointer.y;
  const r=PHYSICS.chargeRadiusPx;
  const d2=dx*dx+dy*dy;
  if(d2>=r*r)return;
  const distance=Math.sqrt(d2)+1;
  const influence=(1-distance/r);
  const force=.0007*pointer.charge*influence*dt;
  velocity[j]-=dx/distance*force;
  velocity[j+1]+=dy/distance*force;
  velocity[j+2]+=Math.sin(seeds[i]*8+frameNumber*.12)*force*.7;
}

// A travelling annular impulse travels across the actual projected anatomy.
function applyShockwave(i,j,dt){
  if(!wave)return;
  const dx=screenX[i]-wave.x,dy=screenY[i]-wave.y;
  const distance=Math.sqrt(dx*dx+dy*dy)+.001;
  const delta=Math.abs(distance-wave.radius);
  if(delta>=PHYSICS.shockWidthPx)return;
  const influence=1-delta/PHYSICS.shockWidthPx;
  const force=PHYSICS.shockVelocity*wave.energy*influence*influence*dt;
  velocity[j]+=dx/distance*force;
  velocity[j+1]-=dy/distance*force;
  velocity[j+2]+=Math.sin(seeds[i]*4.2)*force*.5;
  scatterState[i]=Math.max(scatterState[i],.65+.35*influence);
}

function applyReturn(i,j,dt,t){
  const scattered=scatterState[i];
  const spring=(PHYSICS.returnSpringRest*(1-scattered)+PHYSICS.returnSpringScatter*scattered)*dt;
  const damping=Math.pow(
    PHYSICS.returnDampingRest*(1-scattered)+PHYSICS.returnDampingScatter*scattered,dt
  );
  const bx=Math.sin(t*.65+seeds[i])*.0006;
  const by=Math.cos(t*.73+seeds[i])*.0006;
  velocity[j]=(velocity[j]-(offset[j]-bx)*spring)*damping;
  velocity[j+1]=(velocity[j+1]-(offset[j+1]-by)*spring)*damping;
  velocity[j+2]=(velocity[j+2]-offset[j+2]*spring)*damping;
  offset[j]+=velocity[j]*dt;
  offset[j+1]+=velocity[j+1]*dt;
  offset[j+2]+=velocity[j+2]*dt;
  scatterState[i]*=Math.pow(PHYSICS.scatterDecay,dt);
}

function updatePhysics(dt,t){
  camera.yaw+=(camera.yawGoal-camera.yaw)*.10;
  camera.pitch+=(camera.pitchGoal-camera.pitch)*.10;
  pointer.activity*=Math.pow(PHYSICS.activityDecay,dt);
  pointer.dragX*=Math.pow(.85,dt);
  pointer.dragY*=Math.pow(.85,dt);
  if(pointer.down)pointer.charge=Math.min(PHYSICS.maxCharge,pointer.charge+PHYSICS.chargeRate*dt);
  if(wave){
    wave.radius+=PHYSICS.shockSpeedPx*dt;
    wave.age+=dt;
    if(wave.radius>PHYSICS.shockMaxPx)wave=null;
  }
  const yc=Math.cos(camera.yaw),ys=Math.sin(camera.yaw);
  const pc=Math.cos(camera.pitch),ps=Math.sin(camera.pitch);
  let maxDisplacement=0;
  for(let i=0;i<COUNT;i++){
    const j=i*3;
    project(i,yc,ys,pc,ps);
    applyScatter(i,j,dt);
    applyCharge(i,j,dt);
    applyShockwave(i,j,dt);
    applyReturn(i,j,dt,t);
    if(i%31===0){
      const dist=Math.hypot(offset[j],offset[j+1])*camera.scale;
      if(dist>maxDisplacement)maxDisplacement=dist;
    }
  }
  debug.maxDisplacementPx=Math.round(maxDisplacement);
  debug.charge=pointer.charge;
  debug.orbitYaw=camera.yaw;
  debug.orbitPitch=camera.pitch;
}

function renderBackground(){
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=frameNumber===0?VISUALS.background:'rgba(3,4,10,'+VISUALS.trailFade+')';
  ctx.fillRect(0,0,w,h);
  const halo=ctx.createRadialGradient(w*.5,h*.49,0,w*.5,h*.49,Math.min(w,h)*.38);
  halo.addColorStop(0,'rgba(60,45,137,.17)');
  halo.addColorStop(.55,'rgba(41,33,96,.05)');
  halo.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=halo;
  ctx.fillRect(w*.17,h*.08,w*.66,h*.84);
}

function renderPhotons(){
  ctx.globalCompositeOperation='lighter';
  let drawn=0;
  for(let band=0;band<5;band++){
    ctx.fillStyle=VISUALS.palette[band];
    const box=VISUALS.grainSize+(band>=3?.30:(band>=1?.14:0));
    for(let i=0;i<COUNT;i++){
      if(depthBand[i]!==band)continue;
      const x=screenX[i],y=screenY[i];
      if(x<0||x>=w||y<0||y>=h)continue;
      ctx.fillRect(x,y,box,box);
      drawn++;
    }
  }
  ctx.fillStyle='rgba(151,142,255,.21)';
  for(let i=0;i<COUNT;i+=VISUALS.haloStep){
    const x=screenX[i],y=screenY[i];
    if(x>-4&&x<w+4&&y>-4&&y<h+4)ctx.fillRect(x-1.25,y-1.25,3.5,3.5);
  }
  ctx.globalCompositeOperation='source-over';
  debug.drawCalls=drawn;
}

function renderInteraction(){
  if(pointer.down&&pointer.inside){
    const radius=18+pointer.charge*24;
    ctx.strokeStyle='rgba(198,190,255,'+Math.min(.52,.18+pointer.charge*.14)+')';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(pointer.x,pointer.y,radius,0,Math.PI*2);ctx.stroke();
  }
  if(wave){
    ctx.strokeStyle='rgba(192,180,255,'+(Math.max(0,.5-wave.age*.018)).toFixed(3)+')';
    ctx.lineWidth=1.1;
    ctx.beginPath();ctx.arc(wave.x,wave.y,wave.radius,0,Math.PI*2);ctx.stroke();
  }
}

function frame(now){
  try{
    const dt=Math.max(.2,Math.min(2.0,(now-last)/16.667||1));
    last=now;
    updatePhysics(dt,now*.001);
    renderBackground();
    renderPhotons();
    renderInteraction();
    frameNumber+=1;
    debug.fpsMeasured=Math.round(1000/Math.max(1,dt*16.667));
    debug.lastFrame=now;
    requestAnimationFrame(frame);
  }catch(e){debug.status='error';showError(e);}
}
status.textContent='18K PHOTONS · MOVE: SCATTER · HOLD: CHARGE · RELEASE: SHOCKWAVE · SHIFT / RIGHT-DRAG: ORBIT';
requestAnimationFrame(frame);
})();
</script></body></html>
