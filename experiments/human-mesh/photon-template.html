<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#03040a" />
<title>Museum of Fields — Human Photon Sculpture (Visible Repair)</title>
<style>
  :root{--bg:#03040a;--text:#f2f0ff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,Arial,Helvetica,sans-serif}
  #canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  #veil{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse 34% 55% at 50% 50%,rgba(94,79,215,.09),transparent 77%),radial-gradient(ellipse 80% 96% at 50% 50%,transparent 44%,rgba(0,0,0,.65) 100%)}
  header{position:fixed;left:clamp(22px,4vw,72px);top:clamp(22px,5vh,54px);display:flex;align-items:center;gap:15px;pointer-events:none}
  .mark{width:38px;height:38px;display:grid;place-items:center;border:1px solid #d4d0ed;border-radius:50%;font:italic 20px Georgia,serif}
  .name{font-size:11px;letter-spacing:.29em;font-weight:600;text-shadow:0 0 17px #5b4cb6}
  #status{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.21em;color:rgba(229,226,253,.64);text-transform:uppercase;white-space:nowrap;pointer-events:none}
  #problem{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:22px 26px;background:rgba(16,15,35,.95);border:1px solid #555080;border-radius:8px;font-size:13px;line-height:1.7;max-width:450px;text-align:center;display:none}
</style></head><body>
<canvas id="canvas"></canvas><div id="veil"></div>
<header><div class="mark">m</div><div class="name">MUSEUM OF FIELDS</div></header>
<div id="status">42K PHOTONS · MOVE / HOLD / RELEASE · WHEEL TO ZOOM</div>
<div id="problem" role="alert"></div>
<script>
(function(){
  'use strict';
  const SIZE={{PHOTON_COUNT}};
  const B64='{{PHOTON_DATA}}';
  const canvas=document.getElementById('canvas');
  const status=document.getElementById('status');
  const problem=document.getElementById('problem');
  let c;
  try { c=canvas.getContext('2d',{alpha:false,desynchronized:true});
    if(!c)throw Error('Canvas 2D unavailable');
  } catch(e) {problem.style.display='block';problem.textContent=e.message;return}
  let points;
  try{
    const s=atob(B64),n=s.length;
    if(n!==SIZE*7)throw Error('Photon data size mismatch');
    const raw=new Uint8Array(n);
    for(let i=0;i<n;i++)raw[i]=s.charCodeAt(i);
    points=new Float32Array(SIZE*3);
    const dat=new DataView(raw.buffer);
    for(let i=0;i<SIZE;i++){
      const k=i*7,j=i*3;
      points[j]=dat.getUint16(k,true)/32767.5-1;
      points[j+1]=dat.getUint16(k+2,true)/32767.5-1;
      points[j+2]=dat.getUint16(k+4,true)/32767.5-1;
    }
    window.photonDebug={loaded:true,points:SIZE,source:'baked CC0 MakeHuman GLB'};
  }catch(e){problem.style.display='block';problem.textContent='Could not decode human model: '+e.message;return}

  const shades=new Uint8Array(SIZE);
  const seeds=new Float32Array(SIZE);
  const drift=new Float32Array(SIZE*3);
  const vel=new Float32Array(SIZE*3);
  let random=17031991;
  function rand(){random=(random*1664525+1013904223)>>>0;return random/4294967296}
  // Deterministic particle palette for repeatable reviews, separate from the 3D model.
  for(let i=0;i<SIZE;i++){
    shades[i]= (rand()*5)|0;
    seeds[i]=rand()*6.28318;
    let j=i*3;
    drift[j]=(rand()-.5)*.008;
    drift[j+1]=(rand()-.5)*.008;
    drift[j+2]=(rand()-.5)*.006;
  }
  const palette=[
    'rgba(112,104,255,.83)',
    'rgba(149,143,255,.92)',
    'rgba(186,187,255,.98)',
    'rgba(224,229,255,.99)',
    'rgba(255,255,255,1)'
  ];
  let w=0,h=0,dpr=1,viewScale=1;
  let yaw=0,yawTarget=0,zoom=1.0;
  let impulse=0,last=performance.now();
  let pointer={x:-1e5,y:-1e5,down:false,inside:false};
  function resize(){
    w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,1.6);
    canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
    c.setTransform(dpr,0,0,dpr,0,0);
    viewScale=Math.min(h*.81,w*.72)*zoom;
  }
  addEventListener('resize',resize,{passive:true});resize();
  function atPointer(e){pointer.x=e.clientX;pointer.y=e.clientY;pointer.inside=true;yawTarget=((e.clientX/w)-.5)*.25;}
  canvas.addEventListener('pointermove',atPointer);
  canvas.addEventListener('pointerdown',e=>{atPointer(e);pointer.down=true;try{canvas.setPointerCapture(e.pointerId)}catch(_){}});
  canvas.addEventListener('pointerup',()=>{if(pointer.down)impulse=1.15;pointer.down=false});
  canvas.addEventListener('pointercancel',()=>pointer.down=false);
  canvas.addEventListener('pointerleave',()=>{pointer.inside=false;pointer.x=-1e5;pointer.y=-1e5});
  canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.65,Math.min(1.7,zoom-e.deltaY*.001));viewScale=Math.min(h*.81,w*.72)*zoom},{passive:false});

  const coordX=new Float32Array(SIZE),coordY=new Float32Array(SIZE),zindex=new Uint8Array(SIZE);
  function update(dt,t){
    const cosy=Math.cos(yaw),siny=Math.sin(yaw);
    const count=SIZE;
    const stride=3;
    const forceRange=120,forceSq=forceRange*forceRange;
    const scale=viewScale;
    let projected=0;
    for(let i=0;i<count;i++){
      let j=i*stride;
      let px=points[j]+drift[j],py=points[j+1]+drift[j+1],pz=points[j+2]+drift[j+2];
      const x3=px*cosy+pz*siny;
      const z3=-px*siny+pz*cosy;
      let x=w*.5+x3*scale;
      let y=h*.51-py*scale;
      coordX[i]=x;coordY[i]=y;
      zindex[i]=Math.min(4,Math.max(0,Math.floor((z3+.35)*4.2)+1));
      if(pointer.inside){
        const dx=x-pointer.x,dy=y-pointer.y;
        const dd=dx*dx+dy*dy;
        if(dd<forceSq){
          const force=(pointer.down?-.002:.0026)*Math.exp(-dd/(forceSq*.46))*dt;
          vel[j]+=dx*force/scale;
          vel[j+1]-=dy*force/scale;
          vel[j+2]+=(rand()-.5)*.0006*dt;
        }
      }
      if(impulse>.008){
        const dx=x-pointer.x,dy=y-pointer.y;
        const dd=dx*dx+dy*dy;
        if(dd<(260*260)){
          const f=.0032*impulse*Math.exp(-dd/(260*260*.7))*dt;
          vel[j]+=dx*f/Math.max(scale,1);
          vel[j+1]-=dy*f/Math.max(scale,1);
        }
      }
      // Spring to the true anatomically-scanned surface, preserving interactive displacement.
      const attract=pointer.down?.016:.026;
      for(let k=0;k<3;k++){
        vel[j+k]=(vel[j+k]-drift[j+k]*attract*dt)*Math.pow(pointer.down?.89:.918,dt);
        drift[j+k]+=vel[j+k]*dt;
      }
    }
    impulse*=Math.pow(.91,dt);
  }
  function draw(now){
    const dt=Math.min(2,Math.max(.2,(now-last)/16.667||1));last=now;
    const t=now*.001;
    yaw+=(yawTarget-yaw)*.045;
    update(dt,t);
    c.globalCompositeOperation='source-over';
    c.fillStyle='#03040a';c.fillRect(0,0,w,h);
    const halo=c.createRadialGradient(w*.5,h*.49,0,w*.5,h*.49,Math.min(w,h)*.39);
    halo.addColorStop(0,'rgba(61,47,124,.26)');halo.addColorStop(.52,'rgba(39,36,88,.075)');halo.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=halo;c.fillRect(w*.14,h*.06,w*.72,h*.88);
    c.globalCompositeOperation='lighter';
    // Dense tiny white-violet photons: high contrast without oversized glowing circles.
    for(let band=0;band<5;band++){
      c.fillStyle=palette[band];
      const box=band>=3?1.65:(band>=1?1.3:1.15);
      for(let i=0;i<SIZE;i++){
        if(zindex[i]!==band)continue;
        const x=coordX[i],y=coordY[i];
        if(x>-5&&y>-5&&x<w+5&&y<h+5)c.fillRect(x,y,box,box);
      }
    }
    c.globalCompositeOperation='source-over';
    window.photonDebug.fpsMeasured=1000/Math.max(1,now-(window.photonDebug.lastFrame||now-16.66));
    window.photonDebug.lastFrame=now;
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  status.textContent=(SIZE/1000).toFixed(0)+'K PHOTONS · MOVE / HOLD / RELEASE · WHEEL TO ZOOM';
})();
</script></body></html>
